<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Formulário</title>

  <style>
    table {
      width: 400px;
      height: 100px;
      border: 1px solid;
      border-collapse: collapse;
    }
    th, td{
      table-layout: fixed;
      width: 40px;
      height: 20%;
      border: 1px solid;
    }
  </style>
</head>


<body>
  <form onsubmit="event.preventDefault();
        nometabela.textContent = nome.value">
    <label for="nome">Nome:</label>
    <input type="text" id="nome">
    <label for="email" >E-mail:</label>
    <input type="email" id="email" >
    <button>Enviar</button>

  </form>

  <table>
    <caption> Agenda</caption>
    <tbody>
      <tr>
        <th>Nome</th>
        <th>Email</th>
      </tr>
      <tr>
        <th  id="nometabela"> </th>
        <th id="emailtabela"> </th>
      </tr>
    </tbody>
  </table>




</body>
</html>
